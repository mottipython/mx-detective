<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="mailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#shadow)" />

  <!-- Subtle Network Grid Lines -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.3">
    <line x1="100" y1="24" x2="100" y2="488" />
    <line x1="256" y1="24" x2="256" y2="488" />
    <line x1="412" y1="24" x2="412" y2="488" />
    <line x1="24" y1="100" x2="488" y2="100" />
    <line x1="24" y1="256" x2="488" y2="256" />
    <line x1="24" y1="412" x2="488" y2="412" />
  </g>

  <!-- Mail Envelope Body -->
  <g filter="url(#shadow)">
    <!-- Envelope Base -->
    <rect x="110" y="160" width="292" height="196" rx="20" fill="url(#mailGrad)" stroke="#cbd5e1" stroke-width="4" />

    <!-- Envelope Flap (Bottom & Sides) -->
    <path d="M110 356 L230 240 M402 356 L282 240" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

    <!-- Envelope Top Flap Open / Closed Lines -->
    <path d="M110 164 L256 270 L402 164" fill="none" stroke="#64748b" stroke-width="5" stroke-linejoin="round" />

    <!-- MX Badge inside envelope -->
    <rect x="196" y="215" width="120" height="42" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="3" />
    <text x="256" y="244" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="900" fill="#10b981" text-anchor="middle" letter-spacing="2">MX:25</text>
  </g>

  <!-- Detective Magnifying Glass -->
  <!-- Handle -->
  <path d="M305 315 L415 425" stroke="#475569" stroke-width="34" stroke-linecap="round" filter="url(#shadow)" />
  <path d="M305 315 L415 425" stroke="#0ea5e9" stroke-width="20" stroke-linecap="round" />
  <path d="M335 345 L410 420" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

  <!-- Lens Rim & Glow -->
  <circle cx="230" cy="240" r="115" fill="none" stroke="#38bdf8" stroke-width="18" filter="url(#glow)" />
  <circle cx="230" cy="240" r="115" fill="url(#glassGrad)" stroke="#e2e8f0" stroke-width="8" filter="url(#shadow)" />

  <!-- Lens Glare Reflection -->
  <path d="M165 175 A 90 90 0 0 1 295 175" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.75" />

  <!-- Small Target Crosshairs in Lens -->
  <circle cx="230" cy="240" r="6" fill="#10b981" />
  <line x1="230" y1="218" x2="230" y2="228" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <line x1="230" y1="252" x2="230" y2="262" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <line x1="208" y1="240" x2="218" y2="240" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <line x1="242" y1="240" x2="252" y2="240" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
</svg>
