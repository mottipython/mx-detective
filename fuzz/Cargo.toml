[package]
name = "mx-detective-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mx-detective = { path = ".." }

[workspace]

[[bin]]
name = "dns_packets"
