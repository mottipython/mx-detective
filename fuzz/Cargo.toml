doc = false

[[bin]]
name = "smtp_lines"
path = "fuzz_targets/smtp_lines.rs"
test = false
doc = false

[[bin]]
name = "http_and_policy"
path = "fuzz_targets/http_and_policy.rs"
test = false
doc = false

[[bin]]
name = "record_parsers"
path = "fuzz_targets/record_parsers.rs"
test = false
doc = false

[[bin]]
name = "certificate_matching"
path = "fuzz_targets/certificate_matching.rs"
test = false
doc = false
