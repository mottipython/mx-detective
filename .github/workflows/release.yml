name: Release & Multi-Platform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (RPM, DEB, Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Version is consistent
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          grep -q "^pkgver=${version}$" packaging/arch/PKGBUILD
          grep -q "global pkg_version ${version}}" packaging/rpm/mx-detective.spec
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test "v${version}" = "$GITHUB_REF_NAME"; fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config rpm zstd libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Read version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"

      - name: Create Linux Tarball
        run: |
          mkdir -p dist/mx-detective-linux-x86_64
          cp target/release/mx-detective dist/mx-detective-linux-x86_64/
          cp packaging/desktop/mx-detective.desktop dist/mx-detective-linux-x86_64/
          cp README.md dist/mx-detective-linux-x86_64/
          cd dist && tar -czvf mx-detective-linux-x86_64.tar.gz mx-detective-linux-x86_64

      - name: Create Debian Package (.deb)
        run: |
          mkdir -p deb_build/data/usr/bin deb_build/data/usr/share/applications deb_build/control
          cp target/release/mx-detective deb_build/data/usr/bin/
          cp packaging/desktop/mx-detective.desktop deb_build/data/usr/share/applications/
          cat << EOF > deb_build/control/control
          Package: mx-detective
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Motti Schleider <motti.schleider@gmail.com>
          Description: Public MX server, SMTP handshake and mail security diagnostic tool
          EOF
          echo "2.0" > deb_build/debian-binary
          cd deb_build/control && tar -czf ../control.tar.gz .
          cd ../data && tar -czf ../data.tar.gz .
          cd .. && ar rcs ../dist/mx-detective_${VERSION}_amd64.deb debian-binary control.tar.gz data.tar.gz

      - name: Create RPM Package (.rpm)
        run: |
          mkdir -p rpm_top/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp target/release/mx-detective rpm_top/SOURCES/
          cp packaging/desktop/mx-detective.desktop rpm_top/SOURCES/
          rpmbuild --define "pkg_version ${VERSION}" --define "_topdir $(pwd)/rpm_top" --define "_tmppath /tmp" -bb packaging/rpm/mx-detective.spec
          cp rpm_top/RPMS/*/*.rpm dist/

      - name: Create Arch Linux Package (.pkg.tar.zst)
        run: |
          mkdir -p arch_build/usr/bin arch_build/usr/share/applications arch_build/usr/share/doc/mx-detective
          cp target/release/mx-detective arch_build/usr/bin/
          cp packaging/desktop/mx-detective.desktop arch_build/usr/share/applications/
          cp README.md arch_build/usr/share/doc/mx-detective/
          for s in 32 48 64 128 256; do
            mkdir -p arch_build/usr/share/icons/hicolor/${s}x${s}/apps
            cp packaging/icons/hicolor/${s}x${s}/apps/mx-detective.png arch_build/usr/share/icons/hicolor/${s}x${s}/apps/
          done
          mkdir -p arch_build/usr/share/icons/hicolor/scalable/apps
          cp packaging/icons/hicolor/scalable/apps/mx-detective.svg arch_build/usr/share/icons/hicolor/scalable/apps/
          TOTAL_SIZE=$(du -sb arch_build | awk '{print $1}')
          BUILD_DATE=$(date +%s)
          cat << EOF > arch_build/.PKGINFO
          pkgname = mx-detective
          pkgbase = mx-detective
          pkgver = ${VERSION}-1
          pkgdesc = Public MX server, SMTP handshake and mail security diagnostic tool
          url = https://github.com/mottipython/mx-detective
          builddate = ${BUILD_DATE}
          packager = Motti Schleider <motti.schleider@gmail.com>
          size = ${TOTAL_SIZE}
          arch = x86_64
          license = MIT
          depend = libx11
          depend = libxcursor
          depend = libxrandr
          depend = libxi
          EOF
          cd arch_build && tar --use-compress-program="zstd -19 -T0" -cf ../dist/mx-detective-${VERSION}-1-x86_64.pkg.tar.zst .PKGINFO usr/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  build-macos:
    name: Build macOS Binary (Intel & Apple Silicon)
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package macOS tarball
        run: |
          mkdir -p dist
          tar -czvf dist/mx-detective-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release mx-detective

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/*.tar.gz

  build-windows:
    name: Build Portable Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Name the portable executable
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/mx-detective.exe dist/mx-detective-windows-x86_64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.exe

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Checksums
        run: |
          cd release-artifacts
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed 's|  \./[^/]*/|  |' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true

  update-docs:
    name: Update install commands in the README
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Regenerate the install section
        run: scripts/update-readme.sh "$GITHUB_REF_NAME"

      - name: Commit
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: install commands for $GITHUB_REF_NAME"
          git push origin HEAD:master
