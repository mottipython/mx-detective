[package]
name = "mx-detective"
version = "0.1.0"
edition = "2021"
authors = ["Motti Schleider <motti.schleider@gmail.com>"]
description = "A diagnostic tool for probing public MX servers, testing connectivity issues, and detecting non-compliant or misbehaving SMTP responses."
license = "MIT"

[lib]
name = "mx_detective"
path = "src/lib.rs"

[[bin]]
name = "mx-detective"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
native-tls = "0.2"
